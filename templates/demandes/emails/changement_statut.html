<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; background: #f4f6f9; padding: 20px; }
        .card { max-width: 600px; margin: 0 auto; background: #ffffff; border-radius: 8px; overflow: hidden; }
        .header { background: #1E3A8A; color: #ffffff; padding: 20px; text-align: center; }
        .content { padding: 25px; }
        .btn { display: inline-block; padding: 12px 20px; background: #F97316; color: #ffffff; text-decoration: none; border-radius: 4px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <img src="cid:logo_hda" alt="H.D.A GLOBAL" height="52" style="display:inline-block;background:#ffffff;border-radius:10px;padding:6px 14px;">
        </div>
        <div class="content">
            <h3>Bonjour {{ demande.client.nom_complet }},</h3>
            <p>Le statut de votre dossier <strong>{{ demande.reference }}</strong> a été mis à jour.</p>
            <p><strong>Nouveau statut :</strong> <span style="background: #1E3A8A; color: #fff; padding: 4px 10px; border-radius: 4px;">{{ demande.get_statut_display }}</span></p>
            <p>Vous pouvez consulter le détail et l'historique de votre demande en ligne :</p>
            <p style="text-align: center; margin: 25px 0;">
                <a href="{{ site_url }}/suivi/{{ demande.token_suivi }}/" class="btn">Consulter mon dossier</a>
            </p>
        </div>
    </div>
</body>
</html>
