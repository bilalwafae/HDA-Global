# DÉMO / SOUTENANCE : l'application tourne dans Docker sur votre PC et un lien HTTPS public est créé
# gratuitement par Cloudflare (aucun compte, aucune carte). Utilisez  lancer_demo.ps1  (voir docs/DEMO_PUBLIQUE.md).
# Données = votre db.sqlite3 et votre dossier media/ (aucune migration à faire).

services:
  web:
    build: .
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             exec gunicorn hda_project.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 60
             --access-logfile - --error-logfile -"
    env_file:
      - .env
    environment:
      USE_SQLITE: "True"
      DEBUG: "False"
      SECRET_KEY: ${DEMO_SECRET_KEY:?lancez lancer_demo.ps1}
      ALLOWED_HOSTS: ".trycloudflare.com,localhost,127.0.0.1"
      CSRF_TRUSTED_ORIGINS: "https://*.trycloudflare.com"
      SITE_URL: ${SITE_URL_DEMO:-http://localhost:8000}
    volumes:
      - ./db.sqlite3:/app/db.sqlite3
      - ./media:/app/media
    ports:
      - "127.0.0.1:8000:8000"

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://web:8000
    depends_on:
      - web
